[package]
name = "tfm2_manager"
version = "1.0.0"
edition = "2021"

# TFM2 Mod Manager: one exe that updates the repo, builds the native DLL, installs every mod into the game, checks
# the install byte for byte, starts the editor and shows the logs, with a WHAT / WHY / HOW for every error.
# Build (Windows exe, from Linux):  cargo build --release --target x86_64-pc-windows-gnu
# Output: copy target/x86_64-pc-windows-gnu/release/tfm2_manager.exe to the repo root as "TFM2 Mod Manager.exe".

[[bin]]
name = "tfm2_manager"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = "s"
strip = true
