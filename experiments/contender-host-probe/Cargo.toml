[package]
name = "tfm2_contender_probe"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
off-map-probe = []
dodge-probe = []
shield-probe = []

[dependencies]
mod-api-stable = { path = "../../native/mod-api-stable" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
serde_json = "1.0"

[profile.release]
opt-level = 2
